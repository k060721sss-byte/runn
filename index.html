<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>야구공 체공시간 테스터</title>

<style>
  /* ===== 화면 모양(디자인) 설정 ===== */
  body {
    font-family: 'Malgun Gothic', sans-serif;
    background: #fff7c2;
    color: #3d2e00;
    max-width: 520px;
    margin: 0 auto;
    padding: 16px;
    text-align: center;
    user-select: none;              /* 연타해도 글자가 선택되지 않게 */
  }
  h1 { font-size: 22px; }
  #time {                           /* 큰 스톱워치 숫자 */
    font-size: 72px;
    font-weight: bold;
    font-variant-numeric: tabular-nums;  /* 숫자 폭을 고정해서 떨리지 않게 */
    margin: 8px 0;
  }
  #sub { color: #8a6d00; min-height: 22px; margin-bottom: 12px; }
  button {
    width: 100%;
    font-size: 28px;
    font-weight: bold;
    padding: 28px;
    border: none;
    border-radius: 16px;
    color: white;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(161, 98, 7, 0.35);
    touch-action: manipulation;     /* 모바일에서 누르는 즉시 반응 */
  }
  button:active { transform: translateY(3px); }
  .ready   { background: linear-gradient(135deg, #ffe44d, #ffb800); color: #3d2e00; }   /* 시작 (밝은 노랑→황금) */
  .running { background: linear-gradient(135deg, #f59e0b, #b45309); }   /* 정지 (호박색→갈색) */
  .stats { display: flex; gap: 8px; margin: 16px 0; }
  .stat { flex: 1; background: #ffe97a; border-radius: 12px; padding: 10px; }
  .stat b { display: block; font-size: 22px; }
  .stat span { font-size: 12px; color: #8a6d00; }
  .card { background: #ffed8f; border-radius: 12px; padding: 14px; margin-bottom: 16px; }
  .card h2 { margin: 0 0 10px; font-size: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { border-bottom: 1px solid #e6c200; padding: 6px; }
  .small { font-size: 12px; padding: 3px 8px; width: auto; border-radius: 6px; background: #b45309; color: #fff; box-shadow: none; }
  .clear { font-size: 14px; padding: 8px; background: #b45309; margin-top: 10px; }
  .note { font-size: 12px; color: #8a6d00; }
  .auth input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 10px; margin-bottom: 8px; border: 1px solid #e6c200; border-radius: 8px; background: #fffbe0; user-select: text; }
  .auth .row { display: flex; gap: 8px; }
  .auth button { font-size: 16px; padding: 12px; background: #b45309; box-shadow: none; border-radius: 10px; }
  .auth .alt { background: #d97706; }
  #authMsg { font-size: 13px; color: #8a6d00; min-height: 18px; margin-top: 8px; }
</style>
</head>

<body>
  <h1>⚾ 야구공 체공시간 테스터</h1>

  <!-- 로그인 영역 (Supabase) -->
  <div class="card auth" id="authCard">
    <h2 id="authTitle">로그인하면 기록이 계정에 저장돼요</h2>
    <div id="loggedOut">
      <input id="email" type="email" placeholder="이메일 (아이디로 사용)" autocomplete="email">
      <input id="password" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password">
      <div class="row">
        <button id="loginBtn">로그인</button>
        <button id="signupBtn" class="alt">회원가입</button>
      </div>
    </div>
    <div id="loggedIn" hidden>
      <div id="whoami" class="note"></div>
      <button id="logoutBtn">로그아웃</button>
    </div>
    <div id="authMsg"></div>
  </div>

  <!-- 스톱워치 숫자 (초 단위, 소수점 둘째 자리까지) -->
  <div id="time">0.00</div>
  <div id="sub">공을 던지는 순간 버튼을 누르세요</div>

  <!-- 시작/정지를 하나의 큰 버튼으로 처리 (스페이스바도 가능) -->
  <button id="mainBtn" class="ready">던졌다! 시작</button>

  <!-- 평균·최고·횟수 -->
  <div class="stats">
    <div class="stat"><b id="avg">-</b><span>평균(초)</span></div>
    <div class="stat"><b id="best">-</b><span>최고(초)</span></div>
    <div class="stat"><b id="num">0</b><span>측정 횟수</span></div>
  </div>

  <!-- 기록 추이 그래프 -->
  <div class="card">
    <h2>기록 추이 그래프</h2>
    <svg id="chart" viewBox="0 0 300 150" style="width:100%"></svg>
  </div>

  <!-- 기록 표 -->
  <div class="card">
    <h2>기록</h2>
    <table>
      <thead><tr><th>회차</th><th>체공시간</th><th>예상 최고높이</th><th></th></tr></thead>
      <tbody id="records"></tbody>
    </table>
    <p id="empty" class="note">아직 기록이 없어요</p>
    <p class="note">최고높이는 같은 높이에서 던지고 받았다고 가정한 추정값(g×t²÷8)이에요.</p>
    <button class="clear" id="clearBtn">기록 전체 삭제</button>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const $ = id => document.getElementById(id);   // id로 화면 요소를 찾는 짧은 도우미 함수

  // ===== Supabase 설정 (Project Settings → API Keys 에서 복사) =====
  const SUPABASE_URL = 'https://iruwrxpyhgivwmvtttla.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_FR33pwOO41DOH0HcBHSGGw_kcQUIeTA';   // service_role / secret 키는 절대 넣지 마세요!
  const keyReady = !SUPABASE_KEY.startsWith('여기에');
  const db = (keyReady && window.supabase) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
  let user = null;         // 로그인한 사용자 (없으면 null = 비로그인, 이 기기에만 저장)

  // ===== 데이터 =====
  let running = false;     // 지금 시간을 재는 중인지
  let startTime = 0;       // 시작한 순간의 시각 (밀리초)
  let timerId = null;      // 화면 숫자를 갱신하는 타이머
  let records = [];        // 체공시간 목록: { id, t(초) }  (id는 DB 번호, 비로그인이면 null)
  function loadLocal() {
    try {
      const raw = JSON.parse(localStorage.getItem('hangtime-records')) || [];
      records = raw.map(t => ({ id: null, t: t }));
    } catch (e) { records = []; }
  }
  function saveLocal() {
    try { localStorage.setItem('hangtime-records', JSON.stringify(records.map(r => r.t))); } catch (e) {}
  }

  const dbProblem = () => !keyReady ? 'Supabase 키가 아직 설정되지 않았어요' : 'Supabase 라이브러리를 불러오지 못했어요 (인터넷 연결 확인 후 새로고침)';
  const msg = text => { $('authMsg').textContent = text || ''; };

  // ===== 예상 최고높이(m): 올라가는 시간 = 체공시간의 절반, h = g × (t/2)² ÷ 2 =====
  const height = t => 9.8 * t * t / 8;
  const f2 = n => n.toFixed(2);

  // ===== 로그인 / 회원가입 / 로그아웃 =====
  async function signUp() {
    if (!db) return msg(dbProblem());
    const { data, error } = await db.auth.signUp({ email: $('email').value.trim(), password: $('password').value });
    if (error) return msg('가입 실패: ' + error.message);
    msg(data.session ? '가입 완료! 로그인됐어요' : '가입 완료! 이메일 인증 후 로그인하세요');
  }
  async function signIn() {
    if (!db) return msg(dbProblem());
    const { error } = await db.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
    if (error) return msg('로그인 실패: ' + error.message);
    msg('');
  }
  async function signOut() { if (db) await db.auth.signOut(); }

  // 로그인 상태가 바뀔 때마다 화면과 기록을 다시 불러와요
  async function applyUser(u) {
    user = u;
    $('loggedOut').hidden = !!u;
    $('loggedIn').hidden = !u;
    $('authTitle').textContent = u ? '내 기록 (계정에 저장 중)' : '로그인하면 기록이 계정에 저장돼요';
    if (u) {
      $('whoami').textContent = u.email + ' 로 로그인됨';
      const { data, error } = await db.from('records').select('id, value').order('created_at', { ascending: true });
      if (error) { msg('기록 불러오기 실패: ' + error.message); records = []; }
      else records = data.map(r => ({ id: r.id, t: Number(r.value) }));
    } else {
      loadLocal();
    }
    render();
  }

  // ===== 시작: 버튼을 누르는 즉시 시각을 기록해요 =====
  function start() {
    startTime = performance.now();
    running = true;
    $('mainBtn').textContent = '받았다! 정지';
    $('mainBtn').className = 'running';
    $('sub').textContent = '측정 중... 공을 잡는 순간 누르세요';
    timerId = setInterval(function () {
      $('time').textContent = f2((performance.now() - startTime) / 1000);
    }, 16);
  }

  // ===== 정지: 시작 시각과의 차이가 곧 체공시간 =====
  async function stop() {
    const t = (performance.now() - startTime) / 1000;
    running = false;
    clearInterval(timerId);
    $('time').textContent = f2(t);
    $('mainBtn').textContent = '던졌다! 시작';
    $('mainBtn').className = 'ready';
    $('sub').textContent = '체공시간 ' + f2(t) + '초 · 예상 최고높이 약 ' + height(t).toFixed(1) + 'm';
    const rec = { id: null, t: t };
    records.push(rec);
    render();
    if (user) {
      // 로그인 상태: DB에 저장하고, 받은 id를 기록에 붙여요
      const { data, error } = await db.from('records').insert({ value: String(t) }).select('id').single();
      if (error) { msg('저장 실패: ' + error.message); records.pop(); render(); return; }
      rec.id = data.id;
    } else {
      saveLocal();
    }
  }

  function toggle() { running ? stop() : start(); }

  // ===== 표/통계/그래프를 다시 그리기 =====
  function render() {
    const ts = records.map(r => r.t);
    $('num').textContent = ts.length;
    if (ts.length) {
      $('avg').textContent = f2(ts.reduce((a, b) => a + b, 0) / ts.length);
      $('best').textContent = f2(Math.max(...ts));
    } else {
      $('avg').textContent = '-';
      $('best').textContent = '-';
    }
    $('records').innerHTML = records.map((r, i) =>
      '<tr><td>' + (i + 1) + '</td><td>' + f2(r.t) + '초</td><td>' + height(r.t).toFixed(1) + 'm</td>' +
      '<td><button class="small" data-i="' + i + '">삭제</button></td></tr>'
    ).reverse().join('');
    $('empty').hidden = records.length > 0;
    renderChart(ts);
  }

  // ===== 그래프: 회차별 체공시간 선 그래프 + 평균선 =====
  function renderChart(ts) {
    const svg = $('chart');
    if (ts.length < 2) {
      svg.innerHTML = '<text x="150" y="80" text-anchor="middle" font-size="12" fill="#8a6d00">기록이 2개 이상이면 그래프가 나와요</text>';
      return;
    }
    const min = Math.min(...ts), max = Math.max(...ts);
    const span = (max - min) || 1;
    const avg = ts.reduce((a, b) => a + b, 0) / ts.length;
    const y = v => 120 - ((v - min) / span) * 90;
    const start = Math.max(0, ts.length - 20);
    const shown = ts.slice(start);
    const pts = shown.map((v, i) => [30 + i * (250 / (shown.length - 1)), y(v)]);
    svg.innerHTML =
      '<line x1="30" x2="280" y1="' + y(avg) + '" y2="' + y(avg) + '" stroke="#92400e" stroke-dasharray="4"/>' +
      '<text x="282" y="' + (y(avg) + 3) + '" font-size="8" fill="#92400e">평균</text>' +
      '<polyline points="' + pts.map(p => p.join(',')).join(' ') + '" fill="none" stroke="#d97706" stroke-width="2"/>' +
      pts.map((p, i) =>
        '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3" fill="#d97706"/>' +
        '<text x="' + p[0] + '" y="' + (p[1] - 7) + '" text-anchor="middle" font-size="8" fill="#3d2e00">' + f2(shown[i]) + '</text>' +
        '<text x="' + p[0] + '" y="142" text-anchor="middle" font-size="8" fill="#8a6d00">' + (start + i + 1) + '</text>'
      ).join('');
  }

  // ===== 버튼 연결 =====
  $('mainBtn').addEventListener('pointerdown', function (e) { e.preventDefault(); toggle(); });
  $('loginBtn').onclick = signIn;
  $('signupBtn').onclick = signUp;
  $('logoutBtn').onclick = signOut;

  // 스페이스바로도 시작/정지 (입력칸에 글자를 쓰는 중에는 무시)
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space' && !e.repeat) { e.preventDefault(); toggle(); }
  });

  // 표의 삭제 버튼
  $('records').onclick = async function (e) {
    if (e.target.dataset.i === undefined) return;
    const i = Number(e.target.dataset.i);
    const rec = records[i];
    if (user && rec.id !== null) {
      const { error } = await db.from('records').delete().eq('id', rec.id);
      if (error) return msg('삭제 실패: ' + error.message);
    }
    records.splice(i, 1);
    if (!user) saveLocal();
    render();
  };

  // 전체 삭제
  $('clearBtn').onclick = async function () {
    if (records.length && confirm('모든 기록을 지울까요?')) {
      if (user) {
        const { error } = await db.from('records').delete().eq('user_id', user.id);
        if (error) return msg('삭제 실패: ' + error.message);
      }
      records = [];
      if (!user) saveLocal();
      render();
    }
  };

  // ===== 시작 =====
  if (db) {
    db.auth.onAuthStateChange((event, session) => { applyUser(session ? session.user : null); });
  } else {
    msg('※ ' + dbProblem() + ' - 지금은 이 기기에만 저장돼요');
    loadLocal();
    render();
  }
</script>
</body>
</html>
